apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: workshop01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: smash6/myapp:latest
          ports:
            - containerPort: 3000