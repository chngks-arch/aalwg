workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /#NO_RUN/
      when: never
    - when: always

stages:
  - build
  - test
  - package

build_angular:
  stage: build
  image: node:25-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  script:
    - npm ci --cache .npm --prefer-offline --force
    - sed -i "s/__APP_VERSION__/${CI_COMMIT_SHORT_SHA}/" src/environments/*.ts
    - node_modules/.bin/ng build
  pages:
    publish: dist/dovbear/browser
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

test_build:
  stage: test
  image: alpine
  services:
    - name: caddy:2-alpine
      alias: caddy
      command:
        - /bin/sh
        - -c
        - caddy file-server --root=/builds/${CI_PROJECT_PATH}/dist/dovbear/browser --listen=:8080
  before_script:
    - apk --update --no-cache add curl
  script:
    - curl http://caddy:8080 | grep -i "<app-root>"
  rules:
    - if: '$CI_COMMIT_TAG == null'

build_container:
  stage: package
  image: docker
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: smash6/dovbear
  script:
    - VERSION=$(basename "$CI_COMMIT_TAG")
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker build -t ${IMAGE_NAME}:${VERSION} .
    - docker push ${IMAGE_NAME}:${VERSION}
  rules:
    - if: $CI_COMMIT_TAG =~ /^release\/v.+/



